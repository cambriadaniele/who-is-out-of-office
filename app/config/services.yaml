parameters:
    env(NEW_USER_ZERO_UNTIL): ''
    app.new_user_zero_until: '%env(NEW_USER_ZERO_UNTIL)%'
    env(SLACK_ENABLED): 'true'
    app.slack_enabled: '%env(bool:SLACK_ENABLED)%'
    profile_images_base_path: 'uploads/profile_images'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Infrastructure/Doctrine/Entity'
            - '../src/Module/**/DTO'
            - '../src/Module/**/Constants'
            - '../src/Kernel.php'

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(DATABASE_URL)%'
            - { db_table: 'user_session' }

    App\Infrastructure\Security\EncryptedTotpAuthenticator:
        decorates: 'scheb_two_factor.security.totp_authenticator'
        arguments:
            $inner: '@.inner'

